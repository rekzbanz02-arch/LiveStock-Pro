<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="LivestockPro — Farm Business Manager for tracking livestock groups, supply costs, and revenue.">
<title>LivestockPro — Farm Business Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CSS VARIABLES & RESET
   ============================================================ */
:root {
  --green-900: #1a3009;
  --green-800: #2D5016;
  --green-700: #3a6b1e;
  --green-600: #4a8826;
  --green-500: #5ea830;
  --green-100: #e8f5e0;
  --green-50:  #f3faf0;
  --amber-600: #b8860b;
  --amber-500: #D4A017;
  --amber-400: #e6b830;
  --amber-100: #fdf3cc;
  --amber-50:  #fffae8;
  --cream:     #FAF7F0;
  --brown-900: #2c1a0e;
  --brown-700: #4a2e1a;
  --brown-400: #8b6347;
  --brown-200: #d4b896;
  --brown-100: #f0e4d4;
  --red-600:   #c0392b;
  --red-100:   #fdecea;
  --blue-600:  #2563eb;
  --blue-100:  #dbeafe;
  --white:     #ffffff;
  --shadow-sm: 0 1px 3px rgba(44,26,14,.08), 0 1px 2px rgba(44,26,14,.06);
  --shadow-md: 0 4px 12px rgba(44,26,14,.10), 0 2px 6px rgba(44,26,14,.06);
  --shadow-lg: 0 10px 30px rgba(44,26,14,.12), 0 4px 12px rgba(44,26,14,.08);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --sidebar-w: 240px;
  --transition: 0.2s cubic-bezier(.4,0,.2,1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--brown-900);
  min-height: 100vh;
  overflow-x: hidden;
}
h1,h2,h3,h4 { font-family: 'Playfair Display', serif; }
a { color: inherit; text-decoration: none; }
button { cursor: pointer; font-family: inherit; }
input, select, textarea { font-family: inherit; }
img { max-width: 100%; }

/* ============================================================
   SPLASH SCREEN
   ============================================================ */
#splash {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--green-800);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 24px;
  transition: opacity 0.5s, visibility 0.5s;
}
#splash.hidden { opacity: 0; visibility: hidden; }
.splash-logo {
  font-family: 'Playfair Display', serif;
  font-size: 2.8rem; font-weight: 800;
  color: var(--white);
  letter-spacing: -1px;
}
.splash-logo span { color: var(--amber-400); }
.splash-tagline { color: var(--green-100); font-size: .95rem; letter-spacing: .05em; }
.splash-status {
  display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,.1); border-radius: 50px;
  padding: 10px 22px; color: var(--white); font-size: .9rem;
}
.splash-spinner {
  width: 18px; height: 18px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: var(--amber-400);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
.splash-btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.splash-btn {
  padding: 10px 24px; border-radius: 50px; border: none;
  font-size: .9rem; font-weight: 600; letter-spacing: .02em;
  transition: var(--transition);
}
.splash-btn.primary { background: var(--amber-500); color: var(--brown-900); }
.splash-btn.primary:hover { background: var(--amber-400); }
.splash-btn.secondary { background: rgba(255,255,255,.15); color: var(--white); border: 1px solid rgba(255,255,255,.3); }
.splash-btn.secondary:hover { background: rgba(255,255,255,.25); }

/* ============================================================
   APP SHELL
   ============================================================ */
#app { display: flex; min-height: 100vh; }
#app.hidden { display: none; }

/* ============================================================
   SIDEBAR
   ============================================================ */
#sidebar {
  width: var(--sidebar-w);
  background: var(--green-800);
  min-height: 100vh;
  display: flex; flex-direction: column;
  position: fixed; left: 0; top: 0; bottom: 0; z-index: 100;
  transition: transform var(--transition);
  overflow-y: auto;
}
#sidebar.collapsed { transform: translateX(calc(-1 * var(--sidebar-w))); }
.sidebar-brand {
  padding: 20px 18px 16px;
  border-bottom: 1px solid rgba(255,255,255,.1);
}
.sidebar-brand h1 {
  font-size: 1.25rem; color: var(--white); font-weight: 700;
  letter-spacing: -.5px;
}
.sidebar-brand h1 span { color: var(--amber-400); }
.sidebar-brand p { font-size: .72rem; color: var(--green-100); margin-top: 2px; }
.sidebar-conn {
  padding: 8px 18px;
  font-size: .72rem; font-weight: 500;
  display: flex; align-items: center; gap: 6px;
}
.conn-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #6ee7b7; box-shadow: 0 0 6px #6ee7b7;
  flex-shrink: 0;
}
.conn-dot.offline { background: #f87171; box-shadow: 0 0 6px #f87171; }
.conn-dot.demo { background: var(--amber-400); box-shadow: 0 0 6px var(--amber-400); }

nav { flex: 1; padding: 8px 0; }
.nav-section { padding: 8px 18px 4px; font-size: .68rem; font-weight: 600; color: var(--green-100); opacity: .6; letter-spacing: .1em; text-transform: uppercase; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 18px; color: rgba(255,255,255,.75);
  font-size: .88rem; font-weight: 500;
  cursor: pointer; transition: var(--transition);
  border-left: 3px solid transparent;
  user-select: none;
  outline: none;
}
.nav-item:focus-visible { background: rgba(255,255,255,.12); outline: 2px solid var(--amber-400); outline-offset: -2px; }
.nav-item:hover { color: var(--white); background: rgba(255,255,255,.07); }
.nav-item.active { color: var(--amber-400); border-left-color: var(--amber-400); background: rgba(212,160,23,.1); }
.nav-item .nav-icon { font-size: 1.1rem; width: 20px; text-align: center; }
.sidebar-footer { padding: 14px 18px; border-top: 1px solid rgba(255,255,255,.1); }
.sidebar-biz { font-size: .82rem; font-weight: 600; color: var(--white); }
.sidebar-owner { font-size: .72rem; color: var(--green-100); opacity: .7; }

/* ============================================================
   MAIN CONTENT
   ============================================================ */
#main {
  margin-left: var(--sidebar-w);
  flex: 1; min-height: 100vh;
  display: flex; flex-direction: column;
  transition: margin-left var(--transition);
}
#main.expanded { margin-left: 0; }
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(250,247,240,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--brown-100);
  padding: 12px 24px;
  display: flex; align-items: center; gap: 14px;
}
.topbar-toggle {
  background: none; border: none;
  font-size: 1.2rem; padding: 4px; color: var(--brown-700);
  display: none; min-width: 44px; min-height: 44px;
  align-items: center; justify-content: center;
}
.topbar-title { font-size: 1.1rem; font-weight: 700; font-family: 'Playfair Display', serif; color: var(--green-800); flex: 1; }
.topbar-actions { display: flex; gap: 8px; align-items: center; }
.topbar-back {
  display: none;
  align-items: center; gap: 4px;
  background: none; border: 1.5px solid var(--brown-200);
  border-radius: var(--radius-sm);
  padding: 4px 10px; font-size: .78rem; font-weight: 600;
  color: var(--brown-700); cursor: pointer; flex-shrink: 0;
  transition: var(--transition); touch-action: manipulation;
  white-space: nowrap; min-height: 44px;
}
.topbar-back:hover { background: var(--brown-100); border-color: var(--brown-400); color: var(--brown-900); }
.topbar-back.visible { display: inline-flex; }
.content-area { flex: 1; padding: 24px; max-width: 1200px; width: 100%; }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px; border-radius: var(--radius-sm);
  border: none; font-size: .875rem; font-weight: 600;
  transition: var(--transition); cursor: pointer;
}
.btn-primary { background: var(--green-800); color: var(--white); }
.btn-primary:hover { background: var(--green-700); }
.btn-amber { background: var(--amber-500); color: var(--brown-900); }
.btn-amber:hover { background: var(--amber-400); }
.btn-outline { background: transparent; color: var(--green-800); border: 1.5px solid var(--green-800); }
.btn-outline:hover { background: var(--green-50); }
.btn-ghost { background: transparent; color: var(--brown-700); border: 1.5px solid var(--brown-200); }
.btn-ghost:hover { background: var(--brown-100); }
.btn-danger { background: var(--red-100); color: var(--red-600); border: 1.5px solid #f5c6c0; }
.btn-danger:hover { background: #fbd5d0; }
.btn-sm { padding: 5px 12px; font-size: .8rem; }
.btn-icon { padding: 7px; background: transparent; border: none; color: var(--brown-400); border-radius: var(--radius-sm); transition: var(--transition); min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
.btn-icon:hover { background: var(--brown-100); color: var(--brown-700); }

/* ============================================================
   CARDS
   ============================================================ */
.card {
  background: var(--white); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm); border: 1px solid var(--brown-100);
  overflow: hidden;
}
.card-header {
  padding: 16px 20px; border-bottom: 1px solid var(--brown-100);
  display: flex; align-items: center; justify-content: space-between;
}
.card-title { font-size: 1rem; font-weight: 700; color: var(--green-800); }
.card-body { padding: 20px; }

/* ============================================================
   STAT CARDS
   ============================================================ */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.stat-card {
  background: var(--white); border-radius: var(--radius-md);
  padding: 18px 20px; border: 1px solid var(--brown-100);
  box-shadow: var(--shadow-sm);
  display: flex; flex-direction: column; gap: 8px;
}
.stat-card .stat-icon { font-size: 1.5rem; }
.stat-card .stat-label { font-size: .75rem; color: var(--brown-400); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.stat-card .stat-value { font-size: 1.7rem; font-weight: 700; font-family: 'Playfair Display', serif; color: var(--green-800); }
.stat-card .stat-sub { font-size: .78rem; color: var(--brown-400); }
.stat-card.accent-amber { border-left: 4px solid var(--amber-500); }
.stat-card.accent-green { border-left: 4px solid var(--green-600); }
.stat-card.accent-blue  { border-left: 4px solid var(--blue-600); }
.stat-card.accent-red   { border-left: 4px solid var(--red-600); }

/* ============================================================
   TABLES
   ============================================================ */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .875rem; }
thead th {
  background: var(--green-50); color: var(--green-800);
  font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em;
  padding: 10px 14px; text-align: left; border-bottom: 2px solid var(--green-100);
  white-space: nowrap; position: sticky; top: 0;
}
tbody tr { border-bottom: 1px solid var(--brown-100); transition: var(--transition); }
tbody tr:hover { background: var(--green-50); }
tbody tr:last-child { border-bottom: none; }
tbody td { padding: 10px 14px; vertical-align: middle; }
tbody tr.row-green { background: #f0fdf4; }
tbody tr.row-yellow { background: #fefce8; }
tbody tr.row-red { background: #fff0f0; }
.tfoot-total td { font-weight: 700; background: var(--amber-50); border-top: 2px solid var(--amber-200, #f0d46a); color: var(--green-800); }

/* ============================================================
   BADGES
   ============================================================ */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px; border-radius: 50px; font-size: .72rem; font-weight: 600;
}
.badge-green  { background: var(--green-100); color: var(--green-700); }
.badge-amber  { background: var(--amber-100); color: var(--amber-600); }
.badge-red    { background: var(--red-100);   color: var(--red-600); }
.badge-blue   { background: var(--blue-100);  color: var(--blue-600); }
.badge-gray   { background: var(--brown-100); color: var(--brown-700); }

/* ============================================================
   FORMS
   ============================================================ */
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-label { font-size: .8rem; font-weight: 600; color: var(--brown-700); }
.form-control {
  padding: 9px 12px; border: 1.5px solid var(--brown-200);
  border-radius: var(--radius-sm); font-size: 1rem;
  background: var(--white); color: var(--brown-900);
  transition: var(--transition); outline: none;
  width: 100%;
}
.form-control:focus { border-color: var(--green-600); box-shadow: 0 0 0 3px rgba(45,80,22,.12); }
.form-control:disabled { background: var(--brown-100); color: var(--brown-400); cursor: not-allowed; }
.form-hint { font-size: .72rem; color: var(--brown-400); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.form-computed {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--green-50); border: 1px solid var(--green-100);
  border-radius: var(--radius-sm); padding: 7px 12px; font-size: .8rem;
  color: var(--green-700); font-weight: 600;
}

/* Segmented buttons */
.seg-btn-group { display: flex; border: 1.5px solid var(--brown-200); border-radius: var(--radius-sm); overflow: hidden; }
.seg-btn { flex: 1; padding: 8px 10px; border: none; background: var(--white); font-size: .8rem; font-weight: 500; color: var(--brown-700); transition: var(--transition); cursor: pointer; }
.seg-btn:not(:last-child) { border-right: 1px solid var(--brown-200); }
.seg-btn.active { background: var(--green-800); color: var(--white); font-weight: 600; }

/* ============================================================
   MODALS
   ============================================================ */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(26,48,9,.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; padding: 16px;
  opacity: 0; visibility: hidden; transition: var(--transition);
}
.modal-backdrop.open { opacity: 1; visibility: visible; }
.modal-box {
  background: var(--white); border-radius: var(--radius-lg);
  width: 100%; max-width: 600px; max-height: 90vh;
  overflow-y: auto; box-shadow: var(--shadow-lg);
  transform: scale(.96) translateY(8px);
  transition: transform var(--transition);
}
.modal-backdrop.open .modal-box { transform: scale(1) translateY(0); }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px; border-bottom: 1px solid var(--brown-100);
  position: sticky; top: 0; background: var(--white); z-index: 1;
}
.modal-title { font-size: 1.1rem; font-weight: 700; color: var(--green-800); }
.modal-close { background: none; border: none; font-size: 1.3rem; color: var(--brown-400); cursor: pointer; padding: 4px 8px; border-radius: 4px; transition: var(--transition); min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
.modal-close:hover { background: var(--brown-100); color: var(--brown-700); }
.modal-body { padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.modal-footer { padding: 16px 22px; border-top: 1px solid var(--brown-100); display: flex; gap: 10px; justify-content: flex-end; background: var(--cream); }

/* ============================================================
   TOAST NOTIFICATIONS
   ============================================================ */
#toast-container {
  position: fixed; bottom: 24px; right: 16px; z-index: 9000;
  display: flex; flex-direction: column; gap: 10px; pointer-events: none;
  max-width: calc(100vw - 32px);
}
.toast {
  background: var(--white); border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg); border: 1px solid var(--brown-100);
  padding: 12px 18px; font-size: .875rem; font-weight: 500;
  display: flex; align-items: center; gap: 10px;
  min-width: 240px; max-width: min(360px, calc(100vw - 32px));
  animation: toastIn .3s ease forwards;
  pointer-events: auto;
}
.toast.success { border-left: 4px solid var(--green-600); }
.toast.error   { border-left: 4px solid var(--red-600); }
.toast.info    { border-left: 4px solid var(--blue-600); }
.toast.warning { border-left: 4px solid var(--amber-500); }
.toast-icon { font-size: 1.1rem; }
.toast.removing { animation: toastOut .3s ease forwards; }

@keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
@keyframes toastOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(20px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ============================================================
   MULTI-CHECKBOX DROPDOWN (RECIPIENT SELECTOR)
   ============================================================ */
.multi-select-wrap { position: relative; }
.multi-select-trigger {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 12px; border: 1.5px solid var(--brown-200);
  border-radius: var(--radius-sm); background: var(--white);
  cursor: pointer; font-size: .875rem; transition: var(--transition);
  user-select: none;
}
.multi-select-trigger:focus-within, .multi-select-trigger.open { border-color: var(--green-600); box-shadow: 0 0 0 3px rgba(45,80,22,.12); }
.multi-select-panel {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 200;
  background: var(--white); border: 1.5px solid var(--brown-200);
  border-radius: var(--radius-md); box-shadow: var(--shadow-md);
  max-height: 240px; overflow-y: auto;
  display: none;
}
.multi-select-panel.open { display: block; }
.ms-group-label { padding: 7px 12px; font-size: .72rem; font-weight: 700; color: var(--green-700); background: var(--green-50); text-transform: uppercase; letter-spacing: .05em; }
.ms-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px; cursor: pointer; transition: var(--transition);
  font-size: .875rem;
}
.ms-item:hover { background: var(--green-50); }
.ms-item input[type=checkbox] { accent-color: var(--green-700); width: 14px; height: 14px; }
.ms-all { border-bottom: 1px solid var(--brown-100); font-weight: 600; }

/* ============================================================
   COMBOBOX
   ============================================================ */
.combobox-wrap { position: relative; }
.combobox-list {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 200;
  background: var(--white); border: 1.5px solid var(--brown-200);
  border-radius: var(--radius-sm); box-shadow: var(--shadow-md);
  max-height: 180px; overflow-y: auto;
  display: none;
}
.combobox-list.open { display: block; }
.combobox-option {
  padding: 8px 12px; cursor: pointer; font-size: .875rem;
  transition: var(--transition);
}
.combobox-option:hover { background: var(--green-50); color: var(--green-800); }

/* ============================================================
   GROUP CARDS
   ============================================================ */
.group-cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.group-card {
  background: var(--white); border-radius: var(--radius-lg);
  border: 1px solid var(--brown-100); box-shadow: var(--shadow-sm);
  overflow: hidden; transition: var(--transition);
}
.group-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.group-card-header {
  padding: 16px 18px;
  background: linear-gradient(135deg, var(--green-800) 0%, var(--green-700) 100%);
  color: var(--white);
  display: flex; align-items: flex-start; gap: 14px;
}
.group-card-icon { font-size: 2.2rem; }
.group-card-info h3 { font-size: 1.05rem; font-weight: 700; }
.group-card-info p  { font-size: .78rem; opacity: .8; margin-top: 2px; }
.group-card-body { padding: 16px 18px; }
.group-mini-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.gms { display: flex; flex-direction: column; gap: 2px; }
.gms-label { font-size: .7rem; color: var(--brown-400); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.gms-value { font-size: 1rem; font-weight: 700; color: var(--green-800); }
.group-card-actions { display: flex; gap: 8px; border-top: 1px solid var(--brown-100); padding: 12px 18px; }

/* ============================================================
   GROUP DETAIL
   ============================================================ */
.group-detail-banner {
  background: linear-gradient(135deg, var(--green-900) 0%, var(--green-800) 100%);
  border-radius: var(--radius-lg); padding: 20px 24px;
  color: var(--white); margin-bottom: 16px;
}
.gdb-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.gdb-icon { font-size: 2.5rem; }
.gdb-title h2 { font-size: 1.4rem; font-weight: 700; }
.gdb-title p  { font-size: .82rem; opacity: .75; }
.gdb-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.gdb-stat { background: rgba(255,255,255,.1); border-radius: var(--radius-sm); padding: 10px 14px; }
.gdb-stat-label { font-size: .7rem; opacity: .7; text-transform: uppercase; letter-spacing: .05em; }
.gdb-stat-value { font-size: 1.1rem; font-weight: 700; margin-top: 2px; }
.gdb-stat-value.amber { color: var(--amber-400); }

/* ============================================================
   ANIMAL CARDS / TABLE
   ============================================================ */
.animal-status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
.dot-healthy    { background: #22c55e; }
.dot-sick       { background: var(--red-600); }
.dot-recovering { background: var(--amber-500); }

<script>
/* =============================================================
   STATE
   ============================================================= */
const State = {
  groups: [],
  animals: [],
  inputs: [],
  sales: [],
  settings: {
    currency: '₱',
    defaultPricePerKilo: 200,
    businessName: 'My Farm',
    ownerName: 'Farm Owner',
    appsScriptUrl: ''
  },
  isDemo: false,
  isConnected: false,
  currentPage: 'dashboard',
  currentGroupId: null,
  pageHistory: [],        // back-button navigation stack
  productHistory: [],     // for combobox memory

  get activeAnimals() {
    const activeGroupIds = new Set(this.groups.filter(g => g.status === 'active').map(g => g.groupId));
    return this.animals.filter(a => a.status === 'active' && activeGroupIds.has(a.groupId));
  },
  get activeGroups() {
    return this.groups.filter(g => g.status === 'active');
  }
};

/* =============================================================
   HELPERS
   ============================================================= */
const uid = () => 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
const fmtCur = (n) => State.settings.currency + Number(n||0).toLocaleString('en', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtNum = (n, d=2) => Number(n||0).toLocaleString('en', {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtDate = (d) => { if(!d) return '—'; const dt = new Date(d); return isNaN(dt) ? d : dt.toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'}); };
const today = () => new Date().toISOString().split('T')[0];
const debounce = (fn, ms=300) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; };
const esc = (s) => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

function ageDisplay(dateAcquired, ageAtAcqValue, ageAtAcqUnit) {
  if (!dateAcquired) return '—';
  const acquired = new Date(dateAcquired);
  const now = new Date();
  // Convert age at acquisition to days
  const unitDays = { days:1, weeks:7, months:30, years:365 };
  const extraDays = (ageAtAcqValue||0) * (unitDays[ageAtAcqUnit||'days']||1);
  const totalDays = Math.floor((now - acquired) / 86400000) + extraDays;
  const months = Math.floor(totalDays / 30);
  const days = totalDays % 30;
  return months > 0 ? `${months}mo ${days}d` : `${days}d`;
}

function daysOnFarm(dateAcquired) {
  if (!dateAcquired) return 0;
  return Math.max(0, Math.floor((new Date() - new Date(dateAcquired)) / 86400000));
}

function animalTypeIcon(type) {
  const m = { pig:'🐷', chicken:'🐔', goat:'🐐', cattle:'🐄', cow:'🐄', duck:'🦆', sheep:'🐑', rabbit:'🐇', fish:'🐟', horse:'🐴' };
  return m[(type||'').toLowerCase()] || '🐾';
}

function healthBadge(h) {
  const m = { healthy:'badge-green', sick:'badge-red', recovering:'badge-amber', quarantine:'badge-blue' };
  const dot = { healthy:'dot-healthy', sick:'dot-sick', recovering:'dot-recovering', quarantine:'dot-quarantine' };
  return `<span class="badge ${m[h]||'badge-gray'}"><span class="animal-status-dot ${dot[h]||''}"></span>${h||'unknown'}</span>`;
}

/* =============================================================
   COMPUTE
   ============================================================= */
const Compute = {
  allocatedInputCost(animalId) {
    return State.inputs
      .filter(inp => {
        const ids = inp.recipientAnimalIds || [];
        return ids.includes(animalId) || ids.includes('ALL');
      })
      .reduce((sum, inp) => {
        const ids = inp.recipientAnimalIds || [];
        const denom = ids.includes('ALL') ? State.activeAnimals.length : ids.length;
        return sum + (parseFloat(inp.totalCost)||0) / Math.max(1, denom);
      }, 0);
  },

  projectedGross(animal) {
    return (parseFloat(animal.currentWeightKg)||0) * (parseFloat(State.settings.defaultPricePerKilo)||0);
  },

  projectedNetProfit(animal) {
    return this.projectedGross(animal) - (parseFloat(animal.acquisitionCost)||0) - this.allocatedInputCost(animal.animalId);
  },

  profitMargin(animal) {
    const g = this.projectedGross(animal);
    if (!g) return 0;
    return (this.projectedNetProfit(animal) / g) * 100;
  },

  weightGain(animal) {
    return (parseFloat(animal.currentWeightKg)||0) - (parseFloat(animal.initialWeightKg)||0);
  },

  groupInputCost(groupId) {
    const gAnimalIds = State.animals.filter(a => a.groupId === groupId).map(a => a.animalId);
    return State.inputs
      .filter(inp => {
        const ids = inp.recipientAnimalIds || [];
        return ids.includes('ALL') || ids.some(id => gAnimalIds.includes(id));
      })
      .reduce((sum, inp) => {
        const ids = inp.recipientAnimalIds || [];
        if (ids.includes('ALL')) {
          const allCount = State.activeAnimals.length;
          const gCount = gAnimalIds.filter(id => State.activeAnimals.find(a=>a.animalId===id)).length;
          return sum + (parseFloat(inp.totalCost)||0) * (gCount / Math.max(1, allCount));
        }
        const gIds = ids.filter(id => gAnimalIds.includes(id));
        return sum + (parseFloat(inp.totalCost)||0) * (gIds.length / Math.max(1, ids.length));
      }, 0);
  },

  groupAcquisitionCost(groupId) {
    return State.animals.filter(a => a.groupId === groupId).reduce((s,a) => s + (parseFloat(a.acquisitionCost)||0), 0);
  },

  groupProjectedRevenue(groupId) {
    return State.animals.filter(a => a.groupId === groupId && a.status==='active').reduce((s,a) => s + this.projectedGross(a), 0);
  },

  totalAcquisitionCost() { return State.animals.reduce((s,a) => s+(parseFloat(a.acquisitionCost)||0),0); },
  totalInputCost() { return State.inputs.reduce((s,i) => s+(parseFloat(i.totalCost)||0),0); },
  totalSalesRevenue() { return State.sales.reduce((s,sl) => s+(parseFloat(sl.grossRevenue)||0),0); },
  totalNetProfit() {
    return State.sales.reduce((s,sl) => s+(parseFloat(sl.netProfit)||0),0);
  },
  projectedTotalRevenue() {
    return State.activeAnimals.reduce((s,a) => s+this.projectedGross(a),0);
  },

  inputsByType() {
    const types = {};
    State.inputs.forEach(inp => {
      const t = inp.inputType || 'other';
      if (!types[t]) types[t] = { count:0, cost:0 };
      types[t].count++;
      types[t].cost += parseFloat(inp.totalCost)||0;
    });
    return types;
  },

  groupInputBreakdown(groupId) {
    const gAnimalIds = State.animals.filter(a => a.groupId === groupId).map(a => a.animalId);
    const byType = {};
    State.inputs.forEach(inp => {
      const ids = inp.recipientAnimalIds || [];
      const relevant = ids.includes('ALL') || ids.some(id => gAnimalIds.includes(id));
      if (!relevant) return;
      let frac = 1;
      if (!ids.includes('ALL')) {
        const cnt = ids.filter(id => gAnimalIds.includes(id)).length;
        frac = cnt / Math.max(1, ids.length);
      } else {
        const allCnt = State.activeAnimals.length;
        const gCnt = gAnimalIds.length;
        frac = gCnt / Math.max(1, allCnt);
      }
      const t = inp.inputType || 'other';
      if (!byType[t]) byType[t] = { qty:0, cost:0, unit: inp.unit };
      byType[t].qty += (parseFloat(inp.quantity)||0) * frac;
      byType[t].cost += (parseFloat(inp.totalCost)||0) * frac;
    });
    return byType;
  }
};

/* =============================================================
   API
   ============================================================= */
const API = {
  async call(action, payload={}) {
    const url = State.settings.appsScriptUrl;
    if (!url) throw new Error('No Apps Script URL configured.');
    const body = JSON.stringify({ action, ...payload });
    const res = await fetch(url, {
      method: 'POST',
      body,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    });
    const text = await res.text();
    try {
      const data = JSON.parse(text);
      if (!data.success) throw new Error(data.error || 'Unknown server error');
      return data;
    } catch(e) {
      throw new Error('Invalid response from server: ' + text.slice(0,100));
    }
  },

  async getData() {
    const r = await this.call('getData');
    return r.data;
  },

  async saveGroup(group) { return this.call('saveGroup', { group }); },
  async saveAnimal(animal) { return this.call('saveAnimal', { animal }); },
  async saveInput(input) { return this.call('saveInput', { input }); },
  async saveSale(sale) { return this.call('saveSale', { sale }); },
  async deleteAnimal(animalId) { return this.call('deleteAnimal', { animalId }); },
  async deleteGroup(groupId) { return this.call('deleteGroup', { groupId }); },
  async saveSettings(settings) { return this.call('saveSettings', { settings }); },
  async deleteInput(inputId) { return this.call('deleteInput', { inputId }); }
};

/* =============================================================
   TOAST
   ============================================================= */
const Toast = {
  show(msg, type='success') {
    const icons = { success:'✅', error:'❌', info:'ℹ️', warning:'⚠️' };
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `<span class="toast-icon">${icons[type]||'💬'}</span><span>${msg}</span>`;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(() => {
      el.classList.add('removing');
      el.addEventListener('animationend', () => el.remove());
    }, 3200);
  }
};

/* =============================================================
   CONFIRM DIALOG
   ============================================================= */
const Modal = {
  _prevFocus: null,
  _trapHandler: null,
  show(title, bodyHTML, footerHTML='') {
    this._prevFocus = document.activeElement;
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = bodyHTML;
    document.getElementById('modal-footer').innerHTML = footerHTML;
    document.getElementById('modal-backdrop').classList.add('open');
    document.getElementById('modal-box').scrollTop = 0;
    // Focus first interactive element
    setTimeout(() => {
      const focusable = document.getElementById('modal-box').querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
      if (focusable.length) focusable[0].focus();
    }, 50);
    this._trapHandler = (e) => trapFocusIn('modal-box', e);
    document.getElementById('modal-box').addEventListener('keydown', this._trapHandler);
  },
  close() {
    document.getElementById('modal-backdrop').classList.remove('open');
    if (this._trapHandler) { document.getElementById('modal-box').removeEventListener('keydown', this._trapHandler); this._trapHandler = null; }
    if (this._prevFocus) { this._prevFocus.focus(); this._prevFocus = null; }
  },
  setFooter(html) { document.getElementById('modal-footer').innerHTML = html; },
  body() { return document.getElementById('modal-body'); }
};

const Confirm = {
  resolve: null,
  _prevFocus: null,
  show(title, msg, icon='⚠️') {
    this._prevFocus = document.activeElement;
    document.getElementById('confirm-icon').textContent = icon;
    document.getElementById('confirm-title').textContent = title;
    document.getElementById('confirm-msg').textContent = msg;
    document.getElementById('confirm-backdrop').classList.add('open');
    setTimeout(() => document.getElementById('confirm-ok').focus(), 50);
    return new Promise(res => { this.resolve = res; });
  },
  close(val) {
    document.getElementById('confirm-backdrop').classList.remove('open');
    if (this.resolve) { this.resolve(val); this.resolve = null; }
    if (this._prevFocus) { this._prevFocus.focus(); this._prevFocus = null; }
  }
};

function trapFocusIn(containerId, e) {
  if (e.key !== 'Tab') return;
  const container = document.getElementById(containerId);
  const focusable = container.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])');
  if (!focusable.length) return;
  const first = focusable[0], last = focusable[focusable.length - 1];
  if (e.shiftKey) { if (document.activeElement === first) { e.preventDefault(); last.focus(); } }
  else { if (document.activeElement === last) { e.preventDefault(); first.focus(); } }
}

/* =============================================================
   INITIALIZATION
   ============================================================= */
async function init() {
  // Load saved URL
  const savedUrl = localStorage.getItem('lp_script_url') || '';
  if (savedUrl) State.settings.appsScriptUrl = savedUrl;
  const savedSettings = localStorage.getItem('lp_settings');
  if (savedSettings) {
    try { Object.assign(State.settings, JSON.parse(savedSettings)); } catch(e) {}
  }

  updateSplash('Connecting to cloud…', false);

  if (!State.settings.appsScriptUrl) {
    updateSplash('No server URL configured.', true, true);
    return;
  }

  try {
    updateSplash('Fetching farm data…', false);
    const data = await API.getData();
    applyServerData(data);
    State.isConnected = true;
    State.isDemo = false;
    loadProductHistory();
    launchApp();
  } catch(e) {
    updateSplash('Connection failed: ' + e.message, true, true);
  }
}

function applyServerData(data) {
  if (!data) return;
  State.groups  = data.groups  || [];
  State.animals = data.animals || [];
  State.inputs  = data.inputs  || [];
  State.sales   = data.sales   || [];
  if (data.settings) Object.assign(State.settings, data.settings);
}

function updateSplash(msg, showActions, showError=false) {
  document.getElementById('splash-msg').textContent = msg;
  if (showActions) {
    document.getElementById('splash-actions').classList.remove('hidden');
    document.getElementById('splash-spinner').style.display = showError ? 'none' : 'block';
  } else {
    document.getElementById('splash-actions').classList.add('hidden');
    document.getElementById('splash-spinner').style.display = 'block';
  }
}

function launchApp() {
  document.getElementById('splash').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  updateConnStatus();
  updateSidebarMeta();
  navigateTo('dashboard');
  setupGlobalEvents();
}

function updateConnStatus() {
  const dot = document.getElementById('conn-dot');
  const lbl = document.getElementById('conn-label');
  dot.className = 'conn-dot';
  if (State.isDemo) {
    dot.classList.add('demo');
    lbl.textContent = 'Demo Mode';
  } else if (State.isConnected) {
    // default green dot — no extra class needed
    lbl.textContent = 'Connected';
  } else {
    dot.classList.add('offline');
    lbl.textContent = 'Offline';
  }
}

function updateSidebarMeta() {
  document.getElementById('sb-biz-name').textContent = State.settings.businessName || 'My Farm';
  document.getElementById('sb-owner').textContent = State.settings.ownerName || '';
}

/* =============================================================
   EVENTS
   ============================================================= */
let _eventsReady = false;
function setupGlobalEvents() {
  if (_eventsReady) return;   // prevent duplicate listeners on re-init
  _eventsReady = true;
  // Nav — click and keyboard
  document.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => {
      State.currentGroupId = null;
      State.pageHistory = [];
      navigateTo(el.dataset.page);
    });
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
    });
  });

  // Sidebar toggle
  document.getElementById('sidebar-toggle').addEventListener('click', toggleSidebar);
  document.getElementById('sidebar-overlay').addEventListener('click', closeSidebar);

  // Back button
  document.getElementById('topbar-back').addEventListener('click', navigateBack);

  // Modal close
  document.getElementById('modal-close').addEventListener('click', Modal.close);
  document.getElementById('modal-backdrop').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-backdrop')) Modal.close();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { Modal.close(); Confirm.close(false); }
  });

  // Confirm dialog
  document.getElementById('confirm-cancel').addEventListener('click', () => Confirm.close(false));
  document.getElementById('confirm-ok').addEventListener('click', () => Confirm.close(true));

}

function setupSplashEvents() {
  document.getElementById('btn-retry-conn').addEventListener('click', init);
  document.getElementById('btn-demo-mode').addEventListener('click', () => { loadDemoData(); launchApp(); });
  document.getElementById('btn-setup').addEventListener('click', () => {
    State.isDemo = true; State.isConnected = false;
    launchApp(); navigateTo('settings');
  });
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const overlay = document.getElementById('sidebar-overlay');
  const toggle = document.getElementById('sidebar-toggle');
  if (window.innerWidth <= 768) {
    const isOpen = sb.classList.toggle('mobile-open');
    overlay.style.display = isOpen ? 'block' : 'none';
    toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  } else {
    const isCollapsed = sb.classList.toggle('collapsed');
    main.classList.toggle('expanded');
    toggle.setAttribute('aria-expanded', isCollapsed ? 'false' : 'true');
  }
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('sidebar-overlay').style.display = 'none';
}

// Sync sidebar state when crossing the mobile/desktop breakpoint
window.addEventListener('resize', () => {
  const sb = document.getElementById('sidebar');
  if (!sb) return;
  if (window.innerWidth > 768) {
    // Switching to desktop: clear mobile-open and ensure overlay is hidden
    sb.classList.remove('mobile-open');
    document.getElementById('sidebar-overlay').style.display = 'none';
  } else {
    // Switching to mobile: clear desktop collapsed state so toggle works cleanly
    sb.classList.remove('collapsed');
    document.getElementById('main').classList.remove('expanded');
  }
});

/* =============================================================
   ROUTER
   ============================================================= */
function navigateTo(page, opts = {}) {
  // Push current position to history unless this is a back-navigation
  if (!opts.isBack && State.currentPage) {
    State.pageHistory.push({ page: State.currentPage, groupId: State.currentGroupId });
    if (State.pageHistory.length > 20) State.pageHistory.shift();
  }

  State.currentPage = page;
  if (!opts.keepGroup) State.currentGroupId = opts.groupId || null;

  document.querySelectorAll('.nav-item').forEach(el => {
    const isActive = el.dataset.page === page;
    el.classList.toggle('active', isActive);
    el.setAttribute('aria-current', isActive ? 'page' : 'false');
  });
  const titles = { dashboard:'📊 Dashboard', groups:'🐄 Groups & Animals', inputs:'💊 Supply Log', revenue:'💰 Revenue & Sales', reports:'📈 Reports & Analytics', settings:'⚙️ Settings' };
  document.getElementById('page-title').textContent = titles[page] || page;
  document.getElementById('topbar-actions').innerHTML = '';

  // Show back button on every page except dashboard (or when no history)
  const backBtn = document.getElementById('topbar-back');
  if (backBtn) {
    if (page === 'dashboard' || State.pageHistory.length === 0) {
      backBtn.classList.remove('visible');
    } else {
      backBtn.classList.add('visible');
    }
  }

  closeSidebar();

  const area = document.getElementById('content-area');
  area.innerHTML = '';
  area.className = 'content-area page-enter';

  switch(page) {
    case 'dashboard': renderDashboard(); break;
    case 'groups':    renderGroupsPage(); break;
    case 'inputs':    renderInputsPage(); break;
    case 'revenue':   renderRevenuePage(); break;
    case 'reports':   renderReportsPage(); break;
    case 'settings':  renderSettingsPage(); break;
  }
}

function navigateBack() {
  if (State.pageHistory.length === 0) { navigateTo('dashboard', { isBack: true }); return; }
  const prev = State.pageHistory.pop();
  State.currentGroupId = prev.groupId || null;
  navigateTo(prev.page, { isBack: true, keepGroup: true });
}

function setupCombobox(inputId, listId, options) {
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  if (!input || !list) return;

  // Render initial options safely
  list.innerHTML = '';
  options.forEach(o => {
    const div = document.createElement('div');
    div.className = 'combobox-option';
    div.textContent = o;
    div.addEventListener('click', () => { input.value = o; list.classList.remove('open'); });
    list.appendChild(div);
  });

  input.addEventListener('focus', () => {
    filterCombobox(input, list, options);
    list.classList.add('open');
  });
  input.addEventListener('input', () => filterCombobox(input, list, options));
  document.addEventListener('click', e => {
    if (!input.contains(e.target) && !list.contains(e.target)) list.classList.remove('open');
  }, true);
}

function filterCombobox(input, list, options) {
  const q = input.value.toLowerCase();
  const filtered = options.filter(o => o.toLowerCase().includes(q));
  list.innerHTML = '';
  filtered.forEach(b => {
    const div = document.createElement('div');
    div.className = 'combobox-option';
    div.textContent = b;
    div.addEventListener('click', () => { input.value = b; list.classList.remove('open'); });
    list.appendChild(div);
  });
}

async function saveAnimal(animalId, groupId) {
  const name = document.getElementById('am-name').value.trim();
  const gid  = document.getElementById('am-group').value;
  if (!name) { Toast.show('Animal name is required.', 'error'); return; }
  if (!gid)  { Toast.show('Please select a group.', 'error'); return; }

  const animal = {
    animalId: animalId || uid(),
    groupId: gid,
    name,
    gender: document.getElementById('am-gender').value,
    breed: document.getElementById('am-breed').value,
    dateAcquired: document.getElementById('am-date').value,
    ageAtAcqValue: parseFloat(document.getElementById('am-age-val').value)||0,
    ageAtAcqUnit: document.getElementById('am-age-unit').value,
    acquisitionType: document.getElementById('am-acqtype').value,
    acquisitionCost: parseFloat(document.getElementById('am-cost').value)||0,
    initialWeightKg: parseFloat(document.getElementById('am-init-wt').value)||0,
    currentWeightKg: parseFloat(document.getElementById('am-curr-wt').value)||0,
    healthStatus: document.getElementById('am-health').value,
    notes: document.getElementById('am-notes').value,
    status: 'active'
  };

  const saveBtn = document.getElementById('am-save');
  const origLabel = saveBtn.textContent;
  saveBtn.disabled = true; saveBtn.textContent = 'Saving…';

  try {
    if (!State.isDemo) await API.saveAnimal(animal);
    const idx = State.animals.findIndex(a=>a.animalId===animal.animalId);
    if (idx>=0) State.animals[idx]=animal; else State.animals.push(animal);
    Modal.close();
    Toast.show(`Animal "${esc(name)}" ${animalId?'updated':'added'} successfully!`, 'success');
    if (State.currentGroupId) renderGroupDetail(State.currentGroupId); else renderGroupsPage();
  } catch(e) {
    Toast.show('Error saving: ' + e.message, 'error');
    saveBtn.disabled = false; saveBtn.textContent = origLabel;
  }
}

async function deleteAnimal(animalId) {
  const animal = State.animals.find(a=>a.animalId===animalId);
  const ok = await Confirm.show(`Delete ${animal?.name||'this animal'}?`, 'This will mark the animal as deleted. You can still see it in reports.', '🗑️');
  if (!ok) return;
  try {
    if (!State.isDemo) await API.deleteAnimal(animalId);
    const idx = State.animals.findIndex(a=>a.animalId===animalId);
    if (idx>=0) State.animals[idx].status = 'deleted';
    Toast.show('Animal removed.', 'info');
    if (State.currentGroupId) renderGroupDetail(State.currentGroupId); else renderGroupsPage();
  } catch(e) { Toast.show('Error: '+e.message,'error'); }
}

async function archiveGroup(groupId) {
  const group = State.groups.find(g=>g.groupId===groupId);
  const ok = await Confirm.show(`Archive "${group?.groupName}"?`, 'All animals in this group will be hidden from active views.', '📦');
  if (!ok) return;

    renderGroupsPage();
  } catch(e) { Toast.show('Error: '+e.message,'error'); }
}

function renderInputsTable() {
  const dateF = document.getElementById('inp-filter-date')?.value || '';
  const typeF = document.getElementById('inp-filter-type')?.value || '';
  const textF = (document.getElementById('inp-filter-text')?.value || '').toLowerCase();

  let data = [...State.inputs].sort((a,b) => new Date(b.date)-new Date(a.date));
  if (dateF) data = data.filter(i=>i.date===dateF);
  if (typeF) data = data.filter(i=>i.inputType===typeF);
  if (textF) data = data.filter(i=>(i.productName||'').toLowerCase().includes(textF));

  const typeIcons = {food:'🌽',medicine:'💊',vitamin:'💉',supplement:'🧪',water:'💧',other:'📦'};
  const tbody = document.getElementById('inputs-tbody');
  if (!tbody) return;

  if (data.length===0) { tbody.innerHTML=`<tr><td colspan="10"><div class="empty-state"><div class="empty-state-icon">📋</div><h3>No inputs found</h3></div></td></tr>`; return; }

  tbody.innerHTML = data.map(inp => {
    const recipients = inp.recipientAnimalIds;
    let recText;
    if (recipients === 'ALL' || (Array.isArray(recipients) && recipients.includes('ALL'))) {
      recText = `<span class="badge badge-green">All Animals</span>`;

        return a ? a.name : '?';
      });
      recText = names.length > 3 ? `${names.slice(0,3).join(', ')} +${names.length-3}` : names.join(', ');
    }
    return `<tr>
      <td>${fmtDate(inp.date)}</td>
      <td><span class="badge badge-${inp.inputType==='medicine'?'red':inp.inputType==='food'?'green':'amber'}">${typeIcons[inp.inputType]||'📦'} ${esc(inp.inputType||'?')}</span></td>

      </div></td>

async function saveInput() {
  const product = document.getElementById('im-product').value.trim();
  if (!product) { Toast.show('Product name is required.','error'); return; }
  const qty = parseFloat(document.getElementById('im-qty').value)||0;
  const uc  = parseFloat(document.getElementById('im-ucost').value)||0;
  if (qty <= 0) { Toast.show('Quantity must be greater than 0.','error'); return; }

  const allCb = document.getElementById('ms-all-cb');
  let recipientIds;
  if (allCb.checked) {
    recipientIds = 'ALL';
  } else {
    recipientIds = [...document.querySelectorAll('.ms-animal-cb:checked')].map(cb=>cb.value);
    if (!recipientIds.length) { Toast.show('Please select at least one animal.','error'); return; }
  }

  const input = {
    inputId: uid(),
    date: document.getElementById('im-date').value,
    inputType: document.getElementById('im-type').value,
    productName: product,
    unit: document.getElementById('im-unit').value,
    quantity: qty,
    unitCost: uc,
    totalCost: qty*uc,
    recipientAnimalIds: recipientIds,
    administeredBy: document.getElementById('im-by').value,
    notes: document.getElementById('im-notes').value
  };

  const btn = document.getElementById('im-save');
  btn.disabled=true; btn.textContent='Saving…';
  try {
    if (!State.isDemo) await API.saveInput(input);
    State.inputs.push(input);
    if (!State.productHistory.includes(product)) State.productHistory.push(product);
    Modal.close();
    Toast.show(`Input "${product}" logged!`,'success');
    renderInputsPage();
  } catch(e) { Toast.show('Error: '+e.message,'error'); btn.disabled=false; btn.textContent='💊 Log Input'; }
}

async function deleteInput(inputId) {
  const ok = await Confirm.show('Delete this input entry?','This cannot be undone.','🗑️');
  if (!ok) return;
  try {
    if (!State.isDemo) await API.deleteInput(inputId);
    State.inputs = State.inputs.filter(i=>i.inputId!==inputId);
    Toast.show('Input deleted.','info');
    renderInputsPage();
  } catch(e) { Toast.show('Error deleting: '+e.message,'error'); }
}

function renderRevenueTable() {
  const tbody = document.getElementById('rev-tbody');
  const tfoot = document.getElementById('rev-tfoot');
  if (!tbody) return;

  const animals = State.activeAnimals;
  if (animals.length===0) {
    tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state"><div class="empty-state-icon">📊</div><h3>No active animals</h3></div></td></tr>`;
    return;
  }

  let totGross=0, totAcq=0, totInp=0, totProfit=0;
  tbody.innerHTML = animals.map(a => {
    const group = State.groups.find(g=>g.groupId===a.groupId);
    const alloc = Compute.allocatedInputCost(a.animalId);
    const gross = Compute.projectedGross(a);
    const profit = Compute.projectedNetProfit(a);
    const margin = Compute.profitMargin(a);
    totGross+=gross; totAcq+=(parseFloat(a.acquisitionCost)||0); totInp+=alloc; totProfit+=profit;
    const rowCls = profit>0.2*gross?'row-green':profit<0?'row-red':'row-yellow';
    const mColor = margin>20?'text-green':margin<0?'text-red':'text-amber';
    return `<tr class="${rowCls}">
      <td><strong>${esc(a.name)}</strong></td>
      <td><span class="text-sm">${animalTypeIcon(group?.animalType||'')} ${esc(group?.groupName||'—')}</span></td>
      <td><strong>${fmtNum(a.currentWeightKg)}</strong></td>
      <td>${fmtCur(gross)}</td>
      <td>${fmtCur(a.acquisitionCost)}</td>
      <td>${fmtCur(alloc)}</td>
      <td class="${profit>=0?'text-green':'text-red'} font-bold">${fmtCur(profit)}</td>
      <td class="${mColor} font-bold">${fmtNum(margin,1)}%</td>
      <td>${healthBadge(a.healthStatus)}</td>
    </tr>`;
  }).join('');

  const totMargin = totGross>0?(totProfit/totGross*100):0;
  tfoot.innerHTML = `
    <td><strong>TOTAL</strong></td><td></td>
    <td><strong>${fmtNum(animals.reduce((s,a)=>s+(parseFloat(a.currentWeightKg)||0),0))} kg</strong></td>
    <td><strong>${fmtCur(totGross)}</strong></td>
    <td><strong>${fmtCur(totAcq)}</strong></td>

async function recordSale() {
  const animalId = document.getElementById('sl-animal').value;
  const weight = parseFloat(document.getElementById('sl-weight').value)||0;
  const price  = parseFloat(document.getElementById('sl-price').value)||0;
  const saleDate = document.getElementById('sl-date').value;
  if (!saleDate) { Toast.show('Please enter the date of sale.','error'); return; }
  if (!weight||!price) { Toast.show('Weight and price are required.','error'); return; }

  const animal = State.animals.find(a=>a.animalId===animalId);
  const group  = animal ? State.groups.find(g=>g.groupId===animal.groupId) : null;
  const acqCost = parseFloat(animal?.acquisitionCost)||0;
  const inpCost = Compute.allocatedInputCost(animalId);
  const gross = weight*price;

  const sale = {
    saleId: uid(),
    date: saleDate,
    animalId, animalName: animal?.name||'', groupName: group?.groupName||'',
    weightAtSaleKg: weight, pricePerKilo: price,
    grossRevenue: gross, acquisitionCost: acqCost,
    totalInputCostAllocated: inpCost,
    netProfit: gross - acqCost - inpCost,
    buyerName: document.getElementById('sl-buyer').value,
    notes: document.getElementById('sl-notes').value
  };

  const btn = document.getElementById('sl-save');
  btn.disabled=true; btn.textContent='Saving…';
  try {
    if (!State.isDemo) await API.saveSale(sale);
    State.sales.push(sale);
    // Mark animal as sold
    if (animal) animal.status='sold';
    if (!State.isDemo && animal) await API.saveAnimal(animal).catch(()=>{});
    Modal.close();
    Toast.show(`Sale recorded: ${fmtCur(gross)} gross revenue!`,'success');
    renderRevenuePage();
  } catch(e) { Toast.show('Error: '+e.message,'error'); btn.disabled=false; btn.textContent='💰 Record Sale'; }
}

function drawCostChart() {
  const canvas = document.getElementById('chart-costs');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const byType = Compute.inputsByType();
  const labels = Object.keys(byType);
  const values = labels.map(l=>byType[l].cost);
  const colors = ['#5ea830','#D4A017','#2563eb','#e67e22','#8e44ad','#e74c3c'];

  const maxV = Math.max(...values, 1);
  const W=canvas.offsetWidth||350, H=220;
  canvas.width=W; canvas.height=H;
  const bw=Math.max(30, (W-60)/Math.max(labels.length,1)-10);
  const startX=40;

  ctx.clearRect(0,0,W,H);
  // Y axis
  ctx.strokeStyle='#e0d6cc'; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=H-30-(i/4)*(H-50);
    ctx.beginPath(); ctx.moveTo(30,y); ctx.lineTo(W-10,y); ctx.stroke();
    ctx.fillStyle='#8b6347'; ctx.font='10px DM Sans';
    ctx.fillText(fmtCur(maxV*i/4).replace(/\.00$/,''),2,y+4);
  }

  labels.forEach((label,i) => {
    const barH = values[i]/maxV*(H-50);
    const x=startX+i*(bw+10);
    const y=H-30-barH;
    ctx.fillStyle=colors[i%colors.length];
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x,y,bw,barH,4) : ctx.rect(x,y,bw,barH);
    ctx.fill();
    ctx.fillStyle='#4a2e1a'; ctx.font='10px DM Sans'; ctx.textAlign='center';
    ctx.fillText(label.slice(0,6),x+bw/2,H-8);
    if (values[i]>0) { ctx.fillStyle=colors[i%colors.length]; ctx.fillText(fmtCur(values[i]),x+bw/2,y-4); }
  });
}

function drawMonthlyChart() {
  const canvas = document.getElementById('chart-monthly');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  // Group inputs by month
  const monthly = {};
  State.inputs.forEach(inp => {
    const m = (inp.date||'').slice(0,7);
    if (!m) return;
    if (!monthly[m]) monthly[m]=0;
    monthly[m]+=(parseFloat(inp.totalCost)||0);
  });
  const labels = Object.keys(monthly).sort();
  const values = labels.map(l=>monthly[l]);

  if (!labels.length) {
    ctx.fillStyle='#8b6347'; ctx.font='14px DM Sans'; ctx.textAlign='center';
    ctx.fillText('No data yet', canvas.offsetWidth/2, 100);
    return;
  }

  const W=canvas.offsetWidth||700, H=200;
  canvas.width=W; canvas.height=H;
  const maxV=Math.max(...values,1);
  const bw=Math.max(20,(W-60)/Math.max(labels.length,1)-8);

  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='#e0d6cc'; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=H-30-(i/4)*(H-50);
    ctx.beginPath(); ctx.moveTo(40,y); ctx.lineTo(W-10,y); ctx.stroke();
  }

  labels.forEach((m,i)=>{
    const barH=values[i]/maxV*(H-50);
    const x=50+i*(bw+8);
    const y=H-30-barH;
    ctx.fillStyle='#2D5016';
    ctx.beginPath();
    ctx.roundRect?ctx.roundRect(x,y,bw,barH,3):ctx.rect(x,y,bw,barH);
    ctx.fill();
    ctx.fillStyle='#4a2e1a'; ctx.font='9px DM Sans'; ctx.textAlign='center';
    ctx.fillText(m.slice(5),x+bw/2,H-8);
    if(values[i]>0){ ctx.fillStyle='#D4A017'; ctx.font='9px DM Sans'; ctx.fillText(fmtCur(values[i]),x+bw/2,y-4); }
  });
}

const SHEET_NAMES = {
  groups: 'Groups', animals: 'Animals',
  inputs: 'Inputs', sales: 'Sales', settings: 'Settings'
};

const HEADERS = {
  groups:   ['groupId','groupName','animalType','description','dateCreated','status'],
  animals:  ['animalId','groupId','name','gender','breed','dateAcquired','ageAtAcqValue',
             'ageAtAcqUnit','acquisitionType','acquisitionCost','initialWeightKg',
             'currentWeightKg','healthStatus','notes','status'],
  inputs:   ['inputId','date','inputType','productName','unit','quantity','unitCost',
             'totalCost','recipientAnimalIds','administeredBy','notes'],
  sales:    ['saleId','date','animalId','animalName','groupName','weightAtSaleKg',
             'pricePerKilo','grossRevenue','acquisitionCost','totalInputCostAllocated',
             'netProfit','buyerName','notes'],
  settings: ['key','value']
};

function doPost(e) {
  try {
    const req = JSON.parse(e.postData.contents);
    let result;
    switch(req.action) {
      case 'getData':      result = getData(); break;
      case 'saveGroup':    result = upsertRow('groups', req.group, 'groupId'); break;
      case 'saveAnimal':   result = upsertRow('animals', req.animal, 'animalId'); break;
      case 'saveInput':    result = insertRow('inputs', req.input); break;
      case 'saveSale':     result = insertRow('sales', req.sale); break;
      case 'deleteAnimal': result = softDelete('animals', 'animalId', req.animalId); break;
      case 'deleteGroup':  result = softDelete('groups', 'groupId', req.groupId); break;
      case 'saveSettings': result = saveSettings(req.settings); break;
      default: throw new Error('Unknown action: ' + req.action);
    }
    return output({ success: true, data: result });
  } catch(err) {
    return output({ success: false, error: err.message });
  }
}

function output(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.TEXT);
}

function getSheet(name) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sh = ss.getSheetByName(SHEET_NAMES[name]);
  if (!sh) {
    sh = ss.insertSheet(SHEET_NAMES[name]);
    sh.appendRow(HEADERS[name]);
  }
  return sh;
}

function sheetToObjects(name) {
  const sh = getSheet(name);
  const data = sh.getDataRange().getValues();
  if (data.length < 2) return [];
  const headers = data[0];
  return data.slice(1).map(row => {
    const obj = {};
    headers.forEach((h, i) => {
      let v = row[i];
      if (h === 'recipientAnimalIds') {
        try { v = JSON.parse(v); } catch(e) { v = v ? String(v).split(',') : []; }
      }
      obj[h] = v === '' ? null : v;
    });
    return obj;
  });
}

function getData() {
  const settingsRows = sheetToObjects('settings');
  const settings = {};
  settingsRows.forEach(r => { settings[r.key] = r.value; });
  return {
    groups: sheetToObjects('groups'),
    animals: sheetToObjects('animals'),
    inputs: sheetToObjects('inputs'),
    sales: sheetToObjects('sales'),
    settings
  };
}

function upsertRow(sheetName, obj, idField) {
  const sh = getSheet(sheetName);
  const data = sh.getDataRange().getValues();
  const headers = data[0];
  const idCol = headers.indexOf(idField);
  for (let i = 1; i < data.length; i++) {
    if (data[i][idCol] == obj[idField]) {
      const row = headers.map(h => {
        if (h === 'recipientAnimalIds') return JSON.stringify(obj[h]);
        return obj[h] !== undefined ? obj[h] : '';
      });
      sh.getRange(i + 1, 1, 1, row.length).setValues([row]);
      return obj;
    }
  }
  return insertRow(sheetName, obj);
}

function insertRow(sheetName, obj) {
  const sh = getSheet(sheetName);
  const headers = sh.getRange(1, 1, 1, sh.getLastColumn()).getValues()[0];
  const row = headers.map(h => {
    if (h === 'recipientAnimalIds') return JSON.stringify(obj[h]);
    return obj[h] !== undefined ? obj[h] : '';
  });
  sh.appendRow(row);
  return obj;
}

function softDelete(sheetName, idField, idValue) {
  const sh = getSheet(sheetName);
  const data = sh.getDataRange().getValues();
  const headers = data[0];
  const idCol = headers.indexOf(idField);
  const statusCol = headers.indexOf('status');
  for (let i = 1; i < data.length; i++) {
    if (data[i][idCol] == idValue && statusCol >= 0) {
      sh.getRange(i + 1, statusCol + 1).setValue('deleted');
      return { deleted: idValue };
    }
  }
  return { deleted: null };
}

function saveSettings(settingsObj) {
  const sh = getSheet('settings');
  const existing = sh.getDataRange().getValues();
  const keyMap = {};
  for (let i = 1; i < existing.length; i++) keyMap[existing[i][0]] = i + 1;
  Object.entries(settingsObj).forEach(([key, value]) => {
    if (keyMap[key]) sh.getRange(keyMap[key], 2).setValue(value);
    else sh.appendRow([key, value]);
  });
  return settingsObj;
